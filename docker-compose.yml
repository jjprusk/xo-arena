services:
  postgres:
    # pgvector-bundled PG 16 image — same wire/file format as
    # postgres:16-alpine so the existing volume is compatible. Required
    # for the Help System (vector(384) MiniLM embeddings).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: xo
      POSTGRES_PASSWORD: xo
      POSTGRES_DB: xo_arena
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xo -d xo_arena"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    restart: unless-stopped
    # Bypass Docker's embedded DNS (127.0.0.11) and talk to public
    # resolvers directly. The embedded resolver intermittently emits
    # EAI_AGAIN under burst — observed repeatedly while hitting OpenAI's
    # API from this container. macOS hosts running Docker Desktop are
    # particularly prone to the forwarder backing up. Public DNS removes
    # the forwarder from the critical path entirely. Internal Compose
    # service names (postgres, redis, tournament) keep working via
    # Docker's networking layer below DNS resolution.
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://xo:xo@postgres:5432/xo_arena
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:5173,http://localhost:5174
      TOURNAMENT_SERVICE_URL: http://tournament:3001
      INTERNAL_SECRET: xo-arena-internal-dev-secret
      # Read-only baseline directory for the admin Health dashboard's
      # "Perf Baselines" panel. Unset on Fly.io → panel is disabled.
      PERF_BASELINES_DIR: /app/perf/baselines
      # Local dev runs without an OPENAI_API_KEY by default. The help
      # corpus reindex pipeline (admin create/edit doc) calls the embed
      # client inline — without this flag it tries OpenAI, fails, and
      # 500s the admin endpoint even though the DB row was already
      # written. Stub mode keeps reindex deterministic and offline.
      # Staging/prod override this with a real key.
      HELP_EMBED_STUB: "1"
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app/backend
      - ./packages/ai:/app/packages/ai
      - ./packages/db:/app/packages/db
      - ./perf/baselines:/app/perf/baselines:ro
      # Read-only mount of the markdown help corpus for the seeder. New
      # files appear on next backend restart; the seeder is additive only
      # (never overwrites existing DB rows — DB is canonical after seed).
      - ./doc/Help_Corpus:/app/doc/Help_Corpus:ro
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:3000
      TOURNAMENT_URL: http://tournament:3001
      VITE_XO_URL: http://localhost:5173
      # Web Push VAPID public key — the matching private key stays in
      # backend/.env only. Safe to expose to the browser.
      VITE_VAPID_PUBLIC_KEY: "BKJBje66cklVt-3V4Mzc21yv_6YEPgZ3c0xvpyD-kLouNIm1mqP70T0ta56Z7DtuVggkcBuKPTv8j5CvJh6HZrU"
    ports:
      - "5174:5174"
    volumes:
      - ./landing:/app
      - ./packages/xo:/packages/xo           # resolve alias: __dirname(/app)/../packages/xo
      - ./packages/nav:/packages/nav         # resolve alias: __dirname(/app)/../packages/nav
      - ./packages/sdk:/packages/sdk         # resolve alias: __dirname(/app)/../packages/sdk
      - ./packages/game-xo:/packages/game-xo # resolve alias: __dirname(/app)/../packages/game-xo
      - ./packages/game-pong:/packages/game-pong # resolve alias: __dirname(/app)/../packages/game-pong
      - ./packages/ai:/packages/ai           # game-xo imports @xo-arena/ai
      - /app/node_modules
    depends_on:
      - backend

  training-worker:
    # A3b.1 spike — BullMQ worker that consumes jobs from the `training`
    # queue. Shares the backend image (same code, different entrypoint)
    # so future PRs (A3b.2a/2b) can move the real training loop into
    # this process without a second build pipeline. In prod this is the
    # new xo-training-* Fly app; same image, same CMD as below.
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    restart: unless-stopped
    command: ["node", "--experimental-transform-types", "src/queue/worker.js"]
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://xo:xo@postgres:5432/xo_arena
      REDIS_URL: redis://redis:6379
      XO_PROCESS: training-worker
    volumes:
      - ./backend:/app/backend
      - ./packages/ai:/app/packages/ai
      - ./packages/db:/app/packages/db
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  tournament:
    build:
      context: .
      dockerfile: tournament/Dockerfile.dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://xo:xo@postgres:5432/xo_arena
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:5174,http://localhost:5173
      INTERNAL_SECRET: xo-arena-internal-dev-secret
    ports:
      - "3001:3001"
    volumes:
      - ./tournament:/app/tournament
      - ./packages/db:/app/packages/db
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
